services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: oa
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    volumes:
      - .:/code

    ports:
      - "8000:8000"

    depends_on:
      - postgres

    env_file:
      - .env

volumes:
  postgres_data: